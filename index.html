<style>

.top{display:flex;justify-content:space-between;align-items:flex-start}.gear{width:76px;font-size:1.4em}

.link{background:none;border:none;text-decoration:underline;min-height:60px;font-weight:400}.tile{font-size:3em}

video:i=>{const c=contacts[i];return`<div style="background:#1e2a38;color:#fff;margin:-16px;padding:16px;min-height:100vh;text-align:center"><div style="font-size:8em;margin-top:40px">${c.e}</div><h1>${cname(c)}</h1><p class="big" style="color:#7CFC9A">📹 ${t("waOpen",{n:cname(c)})}</p><p style="opacity:.8">${t("demo")}</p><button class="help" onclick="back()">📵 ${t("endCall")}</button></div>`},
confirm:i=>{const c=contacts[i];return`<div style="text-align:center"><div class="tile" style="font-size:5em">${c.e}</div><h1>${t("confirmCall",{n:cname(c)})}</h1><div class="muted">${c.num}</div></div>${B("📞 "+t("callBtn"),`go('calling','${cname(c)}')`,"green")}${B(t("cancel"),"back()","grey")}`},
calling:n=>`<div style="text-align:center;padding-top:60px"><div style="font-size:5em">📞</div><h1>${t("calling")}</h1><p class="big">${n}</p><p class="muted">${t("demo")}</p></div>${B("❌ "+t("cancel"),"home()","grey")}`,
notes:()=>`<h1>📝 ${t("notesT")}</h1>`+notes.slice(0,4).map((n,i)=>`<button style="text-align:left" onclick="go('note',${i})">${n}</button>`).join("")+B("➕ "+t("newNote"),"go('newnote')","green")+BACK(),
note:i=>`<p style="font-size:1.6em;line-height:1.4">${notes[i]}</p>${B("🔊 "+t("readAloud"),`say(notes[${i}])`)}${B("🗑️ "+t("del"),`go('del',${i})`,"grey")}${BACK()}`,
del:i=>`<h1>${t("sure")}</h1><p>${notes[i]}</p>${B(t("yes"),`notes.splice(${i},1);stack.pop();back()`,"help")}${B(t("cancel"),"back()","grey")}`,
newnote:()=>`<h1>${t("newNote")}</h1>${B("🎤 "+t("speak"),"go('speak')","big")}${B("⌨️ "+t("type"),"go('typenote')")}${BACK()}`,
speak:()=>`<div style="text-align:center;font-size:5em">🎤</div><h1 style="text-align:center">${t("listening")}</h1>${B("✓ "+t("save"),"notes.unshift('🎤 Doctor said: walk 20 minutes a day');flash()","green")}${BACK()}`,
typenote:()=>`<h1>${t("type")}</h1><textarea id="nt"></textarea>${B("✓ "+t("save"),"const v=document.getElementById('nt').value.trim();if(v)notes.unshift(v);flash()","green")}${BACK()}`,
saved:()=>`<h1 style="text-align:center;padding-top:80px;font-size:2em">${t("saved")}</h1>`,
today:()=>{const np=nextPill(),ta=appts.find(a=>a.day==="today_");return`<h1>☀️ ${greet()}, ${S.name}</h1><div class="muted">${dateStr()} · ☀️ 22°</div>
<button style="text-align:left" onclick="go('pills')">💊 <b>${t("pills")}</b><br>${t("pillsOf",{a:takenCount(),b:pills.length})} ✓${np?"<br>"+t("nextDue",{t:np.time}):""}</button>
<button style="text-align:left" onclick="go('appts')">📅 <b>${t("appts")}</b><br>${ta?ta.time+" · "+ta.who:t("nothing")}</button>
<button style="text-align:left" onclick="go('notes')">📝 <b>${t("latest")}</b><br>${notes[0]||"—"}</button>
${B("🔊 "+t("readDay"),"readDay()","green")}${BACK()}`},
sos:()=>`<div class="sos"><h1>🆘 ${t("needHelp")}</h1>${B("👩 Sophie – "+t("callBtn"),"stopT();go('calling','Sophie')","green")}${B("🚑 "+t("call112"),"stopT();go('calling','112')","help")}${B("🩺 "+t("med"),"go('medinfo')")}<div class="card big" id="cd" style="text-align:center"></div>${B("🙂 "+t("ok"),"stopT();home()","back")}</div>`,
family:()=>`<div class="fam"><h1>👩 ${t("famTitle")}</h1><p class="muted">${t("famIntro")}</p>${B("💊 "+t("addPill"),"newP={};go('fpill',0)")}${B("📅 "+t("addAppt"),"newA={};go('add',0)")}${B("🔠 "+t("chSize"),"go('setsize')")}${B("🌍 "+t("chLang"),"go('setlang')")}${B("🧭 "+t("guideMe"),"guide=1;home()","green")}${BACK()}</div>`,
fpill:s=>`<div class="fam"><div class="dots">${[0,1].map(j=>j<=s?"●":"○").join(" ")}</div>`+(s==0?`<h1>${t("qPill")}</h1><input id="pn" placeholder="Vitamin D 1000 IU">${B(t("next")+" ➡","newP.name=document.getElementById('pn').value.trim()||'Vitamin D 1000 IU';go('fpill',1)","green")}`:`<h1>${t("qWhen")}</h1>`+SLOTS.map(k=>B(t(k)+" · "+TIMES[k],`pills.push({k:'${k}',time:'${k}'in TIMES?TIMES['${k}']:'',name:newP.name,taken:null});pills.sort((a,b)=>SLOTS.indexOf(a.k)-SLOTS.indexOf(b.k));stack=[['home']];cur=['saved'];render();setTimeout(()=>{cur=['pills'];render()},1200)`)).join(""))+BACK()+`</div>`,
medinfo:()=>`<h1>🩺 ${t("med")}</h1><div class="card" style="line-height:1.6"><b>Maria Fernandes</b><br>${t("birth")}: 03-05-1944<br>${t("medsL")}: Metformin, Aspirin, Ramipril, Simvastatin<br>${t("allergy")}: Penicillin<br>${t("blood")}: A+<br>${t("doctor")}: Dr. Silva, +351 21 000 0000</div>${BACK()}`,
settings:()=>`<h1>⚙️ ${t("settings")}</h1>${B("🆘 "+t("emerg")+": "+S.emerg,"go('setemerg')")}${B("🩺 "+t("medI"),"go('medinfo')")}${B("🌍 "+t("lang"),"go('setlang')")}${B("🔠 "+t("size"),"go('setsize')")}${B("👨‍👩‍👧 "+t("famView"),"go('family')")}<button class="link" onclick="S.setup=false;save();setupStep=0;render()">${t("restart")}</button>${BACK()}`,
setemerg:()=>`<h1>${t("emerg")}</h1>`+contacts.map(c=>B(c.e+" "+cname(c)+(S.emerg==cname(c)?" ✓":""),`S.emerg='${cname(c)}';save();render()`)).join("")+BACK(),
setlang:()=>`<h1>🌍 ${t("lang")}</h1>`+Object.keys(FLAGS).map(l=>B(FLAGS[l]+(S.lang==l?" ✓":""),`S.lang='${l}';save();render()`,"flag")).join("")+BACK(),
setsize:()=>`<h1>🔠 ${t("size")}</h1>`+[0,1,2].map(i=>B(t("sizes")[i]+(S.size==i?" ✓":""),`S.size=${i};save();render()`,"")).join("")+`<p>Aa – EasyDay</p>`+BACK()};
let newA={},setupStep=0,guide=0,newP={};
const ARROW=()=>`<div class="arrow">⬇️</div><div style="text-align:center;color:#b35c00;font-weight:700">${t("tapHere")}</div>`;
const BANNER=()=>guide?`<div class="banner"><b class="big">${t("helping")}</b>${B("👍 "+t("okThanks"),"guide=0;render()","green")}</div>`:"";
function addStep(s){const v=(document.getElementById("ai")||{}).value;if(s==0){newA.who=v||"Dr.";go("add",1)}else{newA.time=v||"10:00";appts.push({day:newA.day||"today_",time:newA.time,who:newA.who,addr:"—"});appts.sort((a,b)=>["today_","tomorrow","friday"].indexOf(a.day)-["today_","tomorrow","friday"].indexOf(b.day));appts=appts.slice(0,3);stack=[["home"]];cur=["saved"];render();setTimeout(()=>{cur=["appts"];render()},1200)}}
function flash(){stack=[["home"]];cur=["saved"];render();setTimeout(()=>{cur=["notes"];render()},1200)}
function readDay(){const np=nextPill(),ta=appts.find(a=>a.day==="today_");say([greet()+", "+S.name+".",t("dayIntro"),t("pillsLeft",{a:takenCount(),b:pills.length}),np?t("nextDue",{t:np.time}):"",ta?t("apptToday",{x:ta.time+", "+ta.who.replace(/[^\p{L}\p{N} .:,]/gu,"")}):t("nothing").replace("🙂",""),notes[0]?t("noteSay",{x:notes[0].replace(/[^\p{L}\p{N} .:,']/gu,"")}):""].join(" "))}
function stopT(){clearInterval(timer);timer=null}
function startSOS(){go("sos");let s=30;const el=()=>document.getElementById("cd");const tick=()=>{if(!el())return;el().textContent=s>0?"⏳ "+t("countdown",{s}):"📩 "+t("sending");if(s<=0){stopT();setTimeout(()=>{if(el())el().textContent="✅ "+t("sent")},2500)}s--};tick();timer=setInterval(tick,1000)}
function setupView(){const st=setupStep,dots=`<div class="dots">${[0,1,2,3].map(j=>j<=st?"●":"○").join(" ")}</div>`,nx=`${B(t("next")+" ➡","setupNext()","green")}<button class="link" onclick="setupStep++;render()">${t("skip")}</button>`;
if(st==0)return dots+`<h1>${t("welcome")} 👋</h1><h1>🌍 ${t("lang")}</h1>`+Object.keys(FLAGS).map(l=>B(FLAGS[l]+(S.lang==l?" ✓":""),`S.lang='${l}';save();render();say(t('welcome'))`,"flag")).join("")+nx;
if(st==1)return dots+`<h1>${t("qName")}</h1><input id="sn" value="${S.name}">`+nx;
if(st==2)return dots+`<h1>${t("qHelp")}</h1>`+contacts.slice(0,2).map(c=>B(c.e+" "+cname(c)+(S.emerg==cname(c)?" ✓":""),`S.emerg='${cname(c)}';save();render()`)).join("")+nx;
if(st==3)return dots+`<h1>${t("qRead")}</h1>`+[0,1,2].map(i=>B(t("sizes")[i]+(S.size==i?" ✓":""),`S.size=${i};save();render()`)).join("")+nx;
return`<div style="text-align:center;padding-top:60px"><div style="font-size:6em;color:#2e7d32">✓</div><h1>${t("allSet",{n:S.name})}</h1></div>`+B(t("start"),"S.setup=true;save();home()","green")}
function setupNext(){const n=document.getElementById("sn");if(n&&n.value.trim())S.name=n.value.trim();save();setupStep++;render()}
const QK=["welcome","qName","qHelp","qRead","allSet"];
function render(){document.documentElement.lang=S.lang;document.documentElement.style.setProperty("--fs",[24,28,33][S.size]+"px");
if(!S.setup){app.innerHTML=setupView();const k=QK[Math.min(setupStep,4)];try{say(t(k,{n:S.name}))}catch(e){}window.scrollTo(0,0);return}
app.innerHTML=V[cur[0]](...cur.slice(1));window.scrollTo(0,0);
clearInterval(clock);if(cur[0]=="home"){clock=setInterval(()=>{const c=document.getElementById("clk");if(c)c.textContent=now()},10000);bindHelp()}}
function bindHelp(){const b=document.getElementById("hb"),f=document.getElementById("hf");let st=null,raf;
const down=e=>{e.preventDefault();st=Date.now();const step=()=>{const p=Math.min(1,(Date.now()-st)/2000);f.style.width=p*100+"%";if(p>=1){st=null;startSOS()}else raf=requestAnimationFrame(step)};raf=requestAnimationFrame(step)};
const up=()=>{st=null;cancelAnimationFrame(raf);if(f)f.style.width=0};
b.addEventListener("pointerdown",down);["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,up));b.oncontextmenu=e=>e.preventDefault()}
render();
</script></body></html>
